<title>Reseki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: producto sobrio tipo Linear/Stripe — neutros cálidos (stone), un solo acento naranja brasa
   que comparte familia con las estrellas de Google; botón primario en tinta, acento solo para estado/foco. */
:root{
  --bg:#ffffff; --bg-subtle:#fafaf9; --surface:#ffffff; --surface-2:#f5f5f4;
  --border:#e7e5e4; --border-strong:#d6d3d1;
  --fg:#0c0a09; --fg-muted:#57534e; --fg-subtle:#a8a29e;
  --accent:#e8590c; --accent-fg:#ffffff; --accent-soft:#fff1e6; --accent-line:#fdd5b8;
  --success:#15803d; --success-soft:#ecfdf3;
  --danger:#c2410c; --danger-soft:#fff4ed;
  --star:#f59e0b; --star-empty:#e7e5e4;
  --shadow-sm:0 1px 2px rgba(12,10,9,.04);
  --shadow-md:0 1px 2px rgba(12,10,9,.04),0 8px 24px -8px rgba(12,10,9,.10);
  --ring:0 0 0 3px rgba(232,89,12,.22);
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px; --r-sm:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0a09; --bg-subtle:#110f0e; --surface:#161413; --surface-2:#1c1a18;
  --border:#292524; --border-strong:#3a3532;
  --fg:#fafaf9; --fg-muted:#a8a29e; --fg-subtle:#6b645f;
  --accent:#fb7c3c; --accent-fg:#1a0d05; --accent-soft:rgba(251,124,60,.12); --accent-line:rgba(251,124,60,.35);
  --success:#4ade80; --success-soft:rgba(74,222,128,.10);
  --danger:#fb923c; --danger-soft:rgba(251,146,60,.10);
  --star:#fbbf24; --star-empty:#3a3532;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.6);
  --ring:0 0 0 3px rgba(251,124,60,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c0a09; --bg-subtle:#110f0e; --surface:#161413; --surface-2:#1c1a18;
  --border:#292524; --border-strong:#3a3532;
  --fg:#fafaf9; --fg-muted:#a8a29e; --fg-subtle:#6b645f;
  --accent:#fb7c3c; --accent-fg:#1a0d05; --accent-soft:rgba(251,124,60,.12); --accent-line:rgba(251,124,60,.35);
  --success:#4ade80; --success-soft:rgba(74,222,128,.10);
  --danger:#fb923c; --danger-soft:rgba(251,146,60,.10);
  --star:#fbbf24; --star-empty:#3a3532;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.6);
  --ring:0 0 0 3px rgba(251,124,60,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-muted)}
.subtle{color:var(--fg-subtle)}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-muted)}
svg.lucide{width:16px;height:16px;stroke-width:1.6;flex:none}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r-sm);border:1px solid transparent;font-size:14px;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,opacity .15s}
.btn-primary{background:var(--fg);color:var(--bg)}
.btn-primary:hover{opacity:.88}
.btn-secondary{background:var(--surface);border-color:var(--border);color:var(--fg);box-shadow:var(--shadow-sm)}
.btn-secondary:hover{border-color:var(--border-strong);background:var(--bg-subtle)}
.btn-ghost{background:transparent;color:var(--fg-muted)}
.btn-ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn-lg{height:42px;padding:0 18px;font-size:15px}
.btn-sm{height:30px;padding:0 10px;font-size:13px}
.btn-block{width:100%}

/* ---------- Campos ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.label{font-size:13px;font-weight:500}
.hint{font-size:13px;color:var(--fg-muted)}
.input,.select,.textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 11px;font-size:14px;transition:border-color .15s,box-shadow .15s}
.input,.select{height:36px}
.textarea{resize:vertical;min-height:84px;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
.input::placeholder,.textarea::placeholder{color:var(--fg-subtle)}

.seg{display:inline-flex;padding:3px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);gap:2px}
.seg button{border:0;background:transparent;height:28px;padding:0 12px;border-radius:5px;font-size:13px;font-weight:500;color:var(--fg-muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm)}

.switch{position:relative;width:36px;height:20px;border-radius:999px;background:var(--border-strong);border:0;padding:0;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}

.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid var(--border);color:var(--fg-muted);background:var(--surface);white-space:nowrap}
.badge.accent{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line)}
.badge.success{color:var(--success);background:var(--success-soft);border-color:transparent}
.badge svg.lucide{width:12px;height:12px}

.stars{display:inline-flex;gap:2px}
.stars svg{width:14px;height:14px}

.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:720px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}

.logo{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:16px;letter-spacing:-.02em}
.logo-mark{width:22px;height:22px;border-radius:6px;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.logo-mark svg{width:13px;height:13px}

/* ============ LANDING ============ */
.l-nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border)}
.l-nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.l-links{display:flex;gap:4px}
.l-links a{font-size:14px;color:var(--fg-muted);padding:6px 10px;border-radius:var(--r-sm)}
.l-links a:hover{color:var(--fg);background:var(--surface-2)}
.l-nav-cta{display:flex;gap:8px;align-items:center}
@media (max-width:820px){.l-links{display:none}}
@media (max-width:440px){.l-nav-cta .btn-ghost{display:none}}

.hero{padding-block:88px 72px;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(36px,5.2vw,58px);line-height:1.04;letter-spacing:-.035em;font-weight:600}
.hero h1 em{font-style:normal;color:var(--fg-muted)}
.hero-sub{font-size:18px;color:var(--fg-muted);margin-top:20px;max-width:34em}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:20px;font-size:13px;color:var(--fg-muted)}
.hero-meta span{display:inline-flex;align-items:center;gap:6px}
.hero-meta svg.lucide{color:var(--fg-subtle)}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding-block:56px 48px;gap:40px}}

.demo-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-md);overflow:hidden;min-width:0}
.demo-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg-subtle);font-size:13px}
.demo-head .dots{display:flex;gap:6px}
.demo-head .dots i{width:9px;height:9px;border-radius:50%;background:var(--border-strong);display:block}
.demo-body{padding:20px;display:flex;flex-direction:column;gap:16px}
.reply-box{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;font-size:14px;min-height:118px}
.reply-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--accent);margin-bottom:6px}
.reply-label svg.lucide{width:13px;height:13px}
.caret{display:inline-block;width:1.5px;height:1em;background:var(--fg);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.demo-actions{display:flex;justify-content:flex-end;gap:8px}

.section{padding-block:88px;border-top:1px solid var(--border)}
.section-head{max-width:620px;margin-bottom:48px}
.section-head h2{font-size:clamp(28px,3.4vw,38px);line-height:1.12;letter-spacing:-.03em;margin-top:10px}
.section-head p{color:var(--fg-muted);margin-top:14px;font-size:16px}
@media (max-width:720px){.section{padding-block:64px}}

.steps{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.step{padding:28px;background:var(--surface);display:flex;flex-direction:column;gap:10px;min-width:0}
.step + .step{border-left:1px solid var(--border)}
.step .n{font-family:var(--mono);font-size:12px;color:var(--fg-subtle)}
.step h3{font-size:17px}
.step p{color:var(--fg-muted);font-size:14.5px}
@media (max-width:820px){.steps{grid-template-columns:1fr}.step + .step{border-left:0;border-top:1px solid var(--border)}}

.features{display:grid;grid-template-columns:repeat(3,1fr);gap:40px 48px}
.feature{display:flex;flex-direction:column;gap:8px;min-width:0}
.feature .ic{width:34px;height:34px;border:1px solid var(--border);border-radius:var(--r);display:grid;place-items:center;margin-bottom:6px;background:var(--surface);box-shadow:var(--shadow-sm)}
.feature h3{font-size:16px}
.feature p{color:var(--fg-muted);font-size:14.5px}
@media (max-width:900px){.features{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.features{grid-template-columns:1fr}}

.pricing{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.price-card{border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:var(--shadow-md);padding:32px;display:flex;flex-direction:column;gap:22px}
.price{display:flex;align-items:baseline;gap:6px}
.price b{font-size:48px;letter-spacing:-.04em;font-weight:600}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.checklist li{display:flex;gap:10px;align-items:flex-start}
.checklist svg.lucide{color:var(--accent);margin-top:3px}
@media (max-width:820px){.pricing{grid-template-columns:1fr;gap:32px}}

.faq{border-top:1px solid var(--border);max-width:760px}
.faq details{border-bottom:1px solid var(--border)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;font-weight:500}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg.lucide{color:var(--fg-subtle);transition:transform .2s}
.faq details[open] summary svg.lucide{transform:rotate(45deg)}
.faq details p{color:var(--fg-muted);padding:0 0 20px;max-width:62ch;font-size:14.5px}

.cta-band{padding-block:96px;border-top:1px solid var(--border);text-align:center}
.cta-band h2{font-size:clamp(28px,3.6vw,40px);letter-spacing:-.03em}
.cta-band p{color:var(--fg-muted);margin-top:12px}
.cta-band .hero-cta{justify-content:center}

.footer{border-top:1px solid var(--border);padding-block:32px 112px;font-size:13px;color:var(--fg-muted)}
.footer .wrap{display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between;align-items:center}
.footer nav{display:flex;flex-wrap:wrap;gap:4px 20px}
.footer a:hover{color:var(--fg)}

/* ============ AUTH ============ */
.auth{min-height:100%;display:grid;place-items:center;padding-block:48px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg-subtle)}
.auth-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:20px}
.auth-card .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-md);padding:28px;display:flex;flex-direction:column;gap:16px}
.divider{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--fg-subtle)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}

/* ============ ONBOARDING ============ */
.ob{min-height:100%;background:var(--bg-subtle);padding-bottom:120px}
.ob-top{border-bottom:1px solid var(--border);background:var(--bg)}
.ob-top .wrap{height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.ob-progress{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--fg-muted)}
.ob-progress .bar{display:flex;gap:4px}
.ob-progress .bar i{display:block;width:28px;height:3px;border-radius:2px;background:var(--border)}
.ob-progress .bar i.on{background:var(--fg)}
.ob-main{max-width:1040px;margin:0 auto;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ob-head{max-width:560px;margin-bottom:32px}
.ob-head h1{font-size:28px;letter-spacing:-.03em}
.ob-head p{color:var(--fg-muted);margin-top:8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-sm)}
.ob-connect{max-width:560px;padding:28px;display:flex;flex-direction:column;gap:20px}
.biz{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg-subtle)}
.biz-ic{width:40px;height:40px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;flex:none}
.notice{display:flex;gap:10px;font-size:13px;color:var(--fg-muted);padding:12px 14px;border:1px dashed var(--border-strong);border-radius:var(--r)}
.notice svg.lucide{margin-top:2px;color:var(--fg-subtle)}
.ob-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.ob-grid > *{min-width:0}
@media (max-width:880px){.ob-grid{grid-template-columns:1fr}}
.ob-form{padding:28px;display:flex;flex-direction:column;gap:24px}
.tones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tone{border:1px solid var(--border);background:var(--surface);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px;transition:border-color .15s,box-shadow .15s}
.tone:hover{border-color:var(--border-strong)}
.tone[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.tone b{font-size:14px;font-weight:500}
.tone span{font-size:12.5px;color:var(--fg-muted);line-height:1.4}
@media (max-width:440px){.tones{grid-template-columns:1fr}}
.ob-preview{position:sticky;top:24px;padding:24px;display:flex;flex-direction:column;gap:16px}
.ob-foot{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
.ob-opts{max-width:620px;display:flex;flex-direction:column}
.opt-row{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;padding:22px 24px}
.opt-row + .opt-row{border-top:1px solid var(--border)}
.opt-row h3{font-size:15px;font-weight:500;letter-spacing:-.01em}
.opt-row p{font-size:13.5px;color:var(--fg-muted);margin-top:4px;max-width:46ch}

/* ============ PANEL ============ */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{border-right:1px solid var(--border);background:var(--bg-subtle);padding:16px 12px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.side-biz{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow-sm)}
.side-biz .av{width:26px;height:26px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:600}
.side-biz div{min-width:0;line-height:1.25}
.side-biz b{font-size:13px;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-biz small{font-size:12px;color:var(--fg-muted)}
.side nav{display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:var(--r-sm);font-size:14px;color:var(--fg-muted);border:0;background:transparent;width:100%;text-align:left}
.nav-item:hover{background:var(--surface-2);color:var(--fg)}
.nav-item[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.nav-item .count{margin-left:auto;font-size:12px;font-family:var(--mono);color:var(--fg-muted)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.demo-flag{font-size:12px;color:var(--fg-muted);border:1px dashed var(--border-strong);border-radius:var(--r-sm);padding:8px 10px;display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.demo-flag svg.lucide{width:14px;height:14px;margin-top:1px}
.user-row{display:flex;align-items:center;gap:10px;padding:6px 8px;font-size:13px}
.user-row .av{width:26px;height:26px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:600}
.user-row div{min-width:0;line-height:1.25}
.user-row small{color:var(--fg-muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.main{min-width:0;padding-bottom:120px}
.main-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:32px 24px;border-bottom:1px solid var(--border)}
.main-head h1{font-size:22px;letter-spacing:-.025em}
.main-head p{font-size:13px;color:var(--fg-muted);margin-top:4px;display:flex;align-items:center;gap:6px}
.main-inner{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:720px){.main-inner{padding-left:40px;padding-right:40px}}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--success);display:inline-block}

.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-top:24px;overflow:hidden}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat + .stat{border-left:1px solid var(--border)}
.stat .k{font-size:12.5px;color:var(--fg-muted)}
.stat .v{font-size:22px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:baseline;gap:6px}
.stat .v small{font-size:12px;font-weight:500;color:var(--fg-muted);letter-spacing:0}
.stat .v small.up{color:var(--success)}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--border)}}

const H = 3600e3, D = 24 * H;
const now = Date.now();
function ago(ts) {
  const d = now - ts;
  if (d < H) return 'hace ' + Math.max(1, Math.round(d / 60000)) + ' min';
  if (d < D) return 'hace ' + Math.round(d / H) + ' h';
  if (d < 7 * D) { const n = Math.round(d / D); return n === 1 ? 'ayer' : 'hace ' + n + ' días'; }
  return new Date(ts).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
}

function stars(n) {

  for (let i = 1; i <= 5; i++) s += '<span style="color:var(' + (i <= n ? '--star' : '--star-empty') + ')">' + STAR + '</span>';
  return s + '</span>';
}

/* ---------- Tema claro / oscuro ---------- */
function isDark() {
  const a = document.documentElement.getAttribute('data-theme');
  return a ? a === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}
function paintThemeBtn() { $('#themeBtn').innerHTML = '<i data-lucide="' + (isDark() ? 'sun' : 'moon') + '"></i>'; icons(); }
$('#themeBtn').onclick = () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('reseki-theme', next); } catch (e) {}
  paintThemeBtn();
};

function typeDemo() {

const SAMPLE = { name: 'Pablo M.', stars: 4, text: 'Muy buena la carne y el vino, aunque el postre tardó bastante. Volveremos.' };
function previewReply() {
  const t = ob.tone, tu = ob.tu;
  const invite = /volv|regres/i.test(ob.extra);
  let p = [];
  if (t === 'cercano') {
    p.push(tu ? '¡Hola, Pablo! Gracias por venir y por lo que cuentas de la carne y el vino.' : '¡Hola, Pablo! Gracias por venir y por lo que nos cuenta de la carne y el vino.');
    p.push(tu ? 'Tienes razón con el postre: tardó más de la cuenta y ya lo hemos hablado en cocina.' : 'Tiene razón con el postre: tardó más de la cuenta y ya lo hemos hablado en cocina.');
    if (invite) p.push(tu ? '¡Te esperamos pronto!' : '¡Le esperamos pronto!');
  } else if (t === 'formal') {
    p.push(tu ? 'Estimado Pablo: te agradecemos tu visita y tu valoración de la carne y de nuestra selección de vinos.' : 'Estimado Pablo: le agradecemos su visita y su valoración de la carne y de nuestra selección de vinos.');
    p.push(tu ? 'Lamentamos la demora con el postre; hemos revisado el servicio para que no vuelva a ocurrir.' : 'Lamentamos la demora con el postre; hemos revisado el servicio para que no vuelva a ocurrir.');
    if (invite) p.push(tu ? 'Será un placer recibirte de nuevo.' : 'Será un placer recibirle de nuevo.');
  } else {
    p.push(tu ? '¡Pablo, gracias! Que la carne y el vino te conquistaran nos ha alegrado el día.' : '¡Pablo, gracias! Que la carne y el vino le conquistaran nos ha alegrado el día.');
    p.push('El postre se hizo de rogar, lo sabemos. Ya le hemos dado un toque al equipo para que salga volando.');
    if (invite) p.push(tu ? 'La próxima, el postre llega antes que tú. ¡Vuelve pronto!' : 'La próxima, el postre llega antes que usted. ¡Vuelva pronto!');
  }
  return p.join(' ') + (ob.sign.trim() ? '\n— ' + ob.sign.trim() : '');
}

        <div class="field"><label class="label" for="o-sign">Firma</label>
          <input class="input" id="o-sign" value="${esc(ob.sign)}" placeholder="Ej: El equipo de Casa Lumbre">

      <div class="rv-av">${r.name.split(' ').map(w => w[0]).slice(0, 2).join('')}</div>
      <div class="rv-who"><b>${r.name}</b>
        <div class="rv-meta">${stars(r.stars)}<span>${ago(r.ts)}</span><span>${LANG[r.lang]}</span></div></div>
      <div class="rv-badges">${r.status === 'pending' && r.stars <= 3 ? '<span class="badge accent"><i data-lucide="shield-alert"></i>Requiere tu aprobación</span>' : ''}</div>
    </div>
    <p class="rv-text">${esc(r.text)}</p>`;

  if (r.status === 'published') {
    const how = { auto: 'Publicada automáticamente', approved: 'Aprobada por ti', edited: 'Editada y aprobada por ti' }[r.how];
    return `<article class="rv" data-id="${r.id}">${head}
      <div class="rv-reply published">
        <div class="rv-reply-head"><span class="reply-label"><i data-lucide="corner-down-right"></i>Respuesta del propietario · ${ago(r.pubTs)}</span><span class="badge success"><i data-lucide="check"></i>${how}</span></div>
        <div class="rv-reply-text">${esc(r.reply)}</div>
      </div></article>`;
  }

  if (discarded.has(r.id)) {
    return `<article class="rv" data-id="${r.id}">${head}
      <div class="rv-discarded"><span>Has descartado la respuesta sugerida.</span>
        <span style="display:flex;gap:8px"><button class="btn btn-secondary btn-sm" data-a="write">Escribir la mía</button><button class="btn btn-primary btn-sm" data-a="regen"><i data-lucide="sparkles"></i>Generar otra</button></span></div></article>`;
  }

  const ed = editing.has(r.id);
  return `<article class="rv" data-id="${r.id}">${head}
    <div class="rv-reply">
      <div class="rv-reply-head"><span class="reply-label"><i data-lucide="sparkles"></i>Respuesta sugerida · ${LANG[r.lang].toLowerCase()}</span></div>
      ${ed ? `<textarea class="textarea" id="ed-${r.id}" rows="5" aria-label="Editar respuesta">${esc(r.reply)}</textarea>`
           : `<div class="rv-reply-text">${esc(r.reply)}</div>`}
      <div class="rv-actions">
        ${ed ? `<button class="btn btn-ghost btn-sm" data-a="cancel">Cancelar</button><button class="btn btn-primary btn-sm" data-a="saveapprove"><i data-lucide="check"></i>Guardar y publicar</button>`
             : `<button class="btn btn-ghost btn-sm" data-a="reject"><i data-lucide="x"></i>Rechazar</button><button class="btn btn-secondary btn-sm" data-a="edit"><i data-lucide="pencil"></i>Editar</button><button class="btn btn-primary btn-sm" data-a="approve"><i data-lucide="check"></i>Aprobar y publicar</button>`}
      </div>
    </div></article>`;
}

function renderList() {
  const items = filtered();
  const list = $('#list');
  if (!items.length) {
    list.innerHTML = `<div class="empty"><span class="ic"><i data-lucide="${tab === 'pending' ? 'inbox' : 'search'}"></i></span>
      <b style="color:var(--fg);font-weight:500">${tab === 'pending' && !starFilter && dateFilter === 'all' ? 'Todo respondido' : 'Ninguna reseña con estos filtros'}</b>
      <span>${tab === 'pending' && !starFilter && dateFilter === 'all' ? 'Te avisaremos cuando llegue una reseña nueva.' : 'Prueba con otras estrellas u otro periodo.'}</span></div>`;
  } else list.innerHTML = items.map(card).join('');
  icons();

  list.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const el = b.closest('.rv'), id = +el.dataset.id, r = reviews.find(x => x.id === id), a = b.dataset.a;
    if (a === 'edit') { editing.add(id); renderList(); const t = $('#ed-' + id); t.focus(); t.setSelectionRange(t.value.length, t.value.length); return; }
    if (a === 'cancel') { editing.delete(id); renderList(); return; }
    if (a === 'reject') { discarded.add(id); renderList(); return; }
    if (a === 'regen') { discarded.delete(id); renderList(); toast('Nueva respuesta generada'); return; }
    if (a === 'write') { discarded.delete(id); r.reply = '— ' + ob.sign; editing.add(id); renderList(); $('#ed-' + id).focus(); $('#ed-' + id).setSelectionRange(0, 0); return; }
    if (a === 'approve' || a === 'saveapprove') {
      if (a === 'saveapprove') { r.reply = $('#ed-' + id).value; r.how = 'edited'; editing.delete(id); } else r.how = 'approved';
      el.classList.add('leaving');
      setTimeout(() => { r.status = 'published'; r.pubTs = Date.now(); renderAll(); toast('Respuesta publicada en Google (demo)'); }, 280);
    }
  });
}

/* =====================================================================
   ROUTER (hash)
   ===================================================================== */
const ROUTES = { inicio: viewLanding, registro: viewAuth, onboarding: viewOnboarding, panel: viewPanel };
function route() {
  const r = location.hash.replace('#', '');
  const key = ROUTES[r] ? r : 'inicio';
  ROUTES[key]();
  document.querySelectorAll('.pv a').forEach(a => a.dataset.r === key ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  if (route.last !== key) window.scrollTo(0, 0);
  route.last = key;
  icons();
}
window.addEventListener('hashchange', route);
route();
paintThemeBtn();
</script>
