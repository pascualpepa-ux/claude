<title>Heat City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;700&display=swap">
<style>
/* Layout: juego 3D a pantalla completa; HUD en las esquinas; mapa y locales como pantallas superpuestas. Look único: noche neón costera. */
:root {
  --night: #0f0b1e;
  --panel: rgba(20, 14, 40, 0.94);
  --line: #3a2f63;
  --text: #f4ecff;
  --muted: #a99cc9;
  --sun: #ff7a3d;
  --pink: #ff3d8b;
  --gold: #ffd23f;
  --ok: #3ddc97;
  --bad: #ff5a5a;
  --display: "Bungee", "Impact", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--night); color: var(--text); font-family: var(--body); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#view { position: fixed; inset: 0; }
#view canvas { display: block; width: 100%; height: 100%; }
.hud { position: fixed; pointer-events: none; font-variant-numeric: tabular-nums; }
.tl { top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); display: grid; gap: 6px; }
.tr { top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); display: grid; gap: 6px; justify-items: end; }
.brand { font-family: var(--display); font-size: 22px; line-height: 1; background: linear-gradient(90deg, var(--sun), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
#zone { font-family: var(--display); font-size: 13px; color: var(--gold); letter-spacing: 0.04em; text-shadow: 0 1px 4px #000; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 13px; display: flex; gap: 10px; }
#money { color: var(--ok); font-weight: 700; }
#mission { max-width: 260px; font-size: 12px; line-height: 1.4; }
#mission b { color: var(--sun); display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
#gps { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--pink); border-radius: 999px; padding: 6px 14px 6px 8px; font-size: 13px; white-space: nowrap; pointer-events: none; }
#gpsArrow { width: 22px; height: 22px; display: grid; place-items: center; color: var(--pink); font-weight: 700; font-size: 18px; }
#minimap { position: fixed; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: 160px; height: 160px; border-radius: 50%; border: 3px solid var(--line); background: var(--night); pointer-events: auto; cursor: pointer; }
#prompt { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(110px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border: 1px solid var(--sun); border-radius: 999px; padding: 8px 16px; font-size: 14px; white-space: nowrap; pointer-events: none; }
#prompt kbd { font-family: var(--display); color: var(--sun); margin-right: 6px; }
#toast { position: fixed; top: calc(64px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); background: var(--gold); color: var(--night); font-weight: 700; font-size: 14px; padding: 9px 16px; border-radius: 10px; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
#help { position: fixed; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); font-size: 11px; color: var(--muted); pointer-events: none; text-shadow: 0 1px 3px #000; line-height: 1.6; }
#help kbd { font-family: var(--display); color: var(--text); font-size: 10px; }
.touch { position: fixed; display: none; gap: 10px; right: calc(186px + env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.touch button { width: 58px; height: 58px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); color: var(--text); font: 700 11px var(--body); }
@media (pointer: coarse) { .touch { display: flex; right: calc(146px + env(safe-area-inset-right, 0px)); } #help { display: none; } #minimap { width: 120px; height: 120px; } }

/* Pantallas superpuestas */
.screen { position: fixed; inset: 0; background: rgba(10, 6, 24, 0.97); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.screen header { display: flex; align-items: center; gap: 12px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.screen header h1 { font-family: var(--display); font-weight: 400; font-size: 20px; margin: 0; }
.screen header .sp { flex: 1; }
.btn { font: 600 13px var(--body); color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
.btn:hover { border-color: var(--sun); }
.btn:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn.primary { background: var(--sun); color: var(--night); border-color: var(--sun); font-weight: 700; }
.btn.gold { background: var(--gold); color: var(--night); border-color: var(--gold); font-weight: 700; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

#mapBody { flex: 1; display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
#mapWrap { position: relative; min-width: 0; min-height: 0; }
#bigmap { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
#bigmap:active { cursor: grabbing; }
#zoomCtl { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; }
#side { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
#search { margin: 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #1a1333; color: var(--text); font: 14px var(--body); }
#cats { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px; }
#cats button { font: 600 11px var(--body); border-radius: 999px; padding: 4px 9px; background: transparent; color: var(--text); border: 1px solid var(--line); cursor: pointer; display: flex; align-items: center; gap: 5px; }
#cats button .d { width: 8px; height: 8px; border-radius: 50%; }
#cats button.off { opacity: 0.35; }
#list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
#list .it { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px; border-radius: 10px; border: none; background: transparent; color: var(--text); cursor: pointer; font: 13px var(--body); }
#list .it:hover, #list .it.sel { background: rgba(255,255,255,0.07); }
#list .it .d { width: 10px; height: 10px; border-radius: 50%; flex: none; }
#list .it small { color: var(--muted); display: block; font-size: 11px; }
#list .it .dist { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; }
#detail { border-top: 1px solid var(--line); padding: 12px; display: grid; gap: 8px; }
#detail h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 16px; }
#detail p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 11px; }
.pill { border-radius: 999px; padding: 3px 9px; border: 1px solid var(--line); color: var(--muted); }
.pill.open { color: var(--ok); border-color: var(--ok); }
.pill.closed { color: var(--bad); border-color: var(--bad); }
.pill.heist { background: var(--gold); color: var(--night); border-color: var(--gold); font-weight: 700; }

#shop .inner { flex: 1; overflow-y: auto; display: grid; place-items: start center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#shopCard { width: min(560px, 100%); display: grid; gap: 14px; }
#shopCard h2 { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 6vw, 36px); margin: 0; line-height: 1.05; text-wrap: balance; }
#shopCard > p { margin: 0; color: var(--muted); line-height: 1.5; }
.items { display: grid; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: rgba(255,255,255,0.05); border-radius: 12px; }
.item .n { flex: 1; min-width: 0; }
.item .p { color: var(--ok); font-weight: 700; font-variant-numeric: tabular-nums; }
.closedNote { padding: 14px; border: 1px dashed var(--bad); border-radius: 12px; color: var(--bad); }
.special { padding: 14px; border-radius: 12px; border: 1px solid var(--gold); display: grid; gap: 10px; }
.special b { color: var(--gold); }
#err { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 28px; color: var(--sun); background: var(--night); }

@media (max-width: 760px) {
  #mapBody { grid-template-columns: 1fr; grid-template-rows: 1fr 45%; }
  #side { border-left: none; border-top: 1px solid var(--line); }
  #help { display: none; }
  .brand { font-size: 18px; }
  #mission { max-width: 170px; }
  #gps { top: auto; bottom: calc(170px + env(safe-area-inset-bottom, 0px)); }
}
</style>

<div id="view"></div>

<div class="hud tl">
  <div class="brand">HEAT CITY</div>
  <div id="zone">—</div>
</div>
<div class="hud tr">
  <div class="chip"><span id="clock">09:00</span><span id="money">$0</span></div>
  <div class="chip" id="mission"></div>
</div>
<div id="gps" hidden><span id="gpsArrow">▲</span><span id="gpsText"></span></div>
<div id="prompt" hidden></div>
<div id="toast" hidden></div>
<canvas id="minimap" width="320" height="320" aria-label="Minimapa. Tocá para abrir el mapa"></canvas>
<div id="help"><kbd>WASD</kbd> moverse · <kbd>SHIFT</kbd> correr · arrastrá el mouse para girar la cámara<br><kbd>E</kbd> entrar · <kbd>F</kbd> subir/bajar del auto · <kbd>M</kbd> mapa</div>
<div class="touch"><button id="tMap" type="button">MAPA</button><button id="tCar" type="button">AUTO</button><button id="tAct" type="button">ENTRAR</button></div>

<section class="screen" id="mapScreen" hidden>
  <header><h1>Mapa</h1><span class="sp"></span><span class="chip" id="mapClock"></span><button class="btn" id="mapClose" type="button">Volver al juego (M)</button></header>
  <div id="mapBody">
    <div id="mapWrap"><canvas id="bigmap"></canvas>
      <div id="zoomCtl"><button class="btn" id="zIn" type="button">+</button><button class="btn" id="zOut" type="button">−</button><button class="btn" id="zMe" type="button">Centrar en mí</button></div>
    </div>
    <aside id="side">
      <input id="search" type="search" placeholder="Buscar tienda, zona o producto…" autocomplete="off">
      <div id="cats"></div>
      <div id="list"></div>
      <div id="detail" hidden></div>
    </aside>
  </div>
</section>

<section class="screen" id="shop" hidden>
  <header><h1 id="shopTitle">Local</h1><span class="sp"></span><span class="chip" id="shopMoney"></span><button class="btn" id="shopClose" type="button">Salir (E)</button></header>
  <div class="inner"><div id="shopCard"></div></div>
</section>

<div id="loading">HEAT CITY</div>
<div id="err" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const S = 0.8;                                    // 1 unidad del mapa = 0.8 m
const W2M = (mx, my) => ({ x: (mx - 500) * S, z: (my - 500) * S });
const M2W = (x, z) => ({ mx: x / S + 500, my: z / S + 500 });

const GLYPH = { armeria:'✦', ropa:'◆', autos:'▲', tatuajes:'✂', comida:'●', tienda24:'24', bar:'♪', inmobiliaria:'⌂', tecnologia:'▣', gimnasio:'≡', banco:'$', empeno:'◎', servicios:'+', club_adulto:'♥' };
const ZONE = {
  'sunset-strip':   { ground:'#4a2b58', bld:['#f2c1d1','#f7e3c4','#c9e7e2','#f6d2a8'], h:[8,22],  accent:'#ff3d8b' },
  'downtown-blaze': { ground:'#2e2846', bld:['#5b5677','#6e6a8c','#45405e','#7d6f8f'], h:[24,80], accent:'#ff7a3d' },
  'coral-keys':     { ground:'#2f7466', bld:['#fff3d6','#bfeee6','#ffd1c1'],          h:[6,14],  accent:'#3ddcd0' },
  'port-sable':     { ground:'#30343d', bld:['#5a636f','#7a6f5f','#3f5566','#8a5a44'], h:[9,18],  accent:'#9aa7bd' },
  'swamp-row':      { ground:'#2c3d26', bld:['#6b5a42','#4f5b3c','#7a6a52'],          h:[4,8],   accent:'#9bd46a' },
  _:                { ground:'#33313f', bld:['#77708a','#8a8070','#5f6a74'],          h:[8,20],  accent:'#b9aed6' }
};
const LAND = [[30,0],[1000,0],[1000,560],[650,640],[600,1000],[0,1000],[0,40]];
const ISLANDS = [[715,700,70],[810,740,60],[690,840,55],[870,650,50],[935,900,60],[670,950,40],[955,770,45]];
const BRIDGES = [[[640,620],[715,700]],[[715,700],[810,740]],[[810,740],[870,650]],[[715,700],[690,840]],[[690,840],[670,950]],[[810,740],[955,770]],[[955,770],[935,900]]];
const PUDDLES = [[60,700,40],[250,760,55],[140,880,35],[320,980,30]];

// ---------- estado ----------
const G = {
  data:null, zones:{}, cats:{}, stores:[],
  minutes: 9*60, money: 2500, story: 0, owned: [], mission: 0, heistCooldown: 0,
  waypoint: null, hidden: new Set(), mode: 'play', inCar: false,
  keys: {}, camYaw: Math.PI, camPitch: 0.35
};
try { const sv = JSON.parse(localStorage.getItem('heatcity-save') || 'null'); if (sv) Object.assign(G, { money: sv.money ?? 2500, story: sv.story || 0, owned: sv.owned || [], mission: sv.mission || 0 }); } catch (e) {}
function save() { try { localStorage.setItem('heatcity-save', JSON.stringify({ money: G.money, story: G.story, owned: G.owned, mission: G.mission })); } catch (e) {} }

// ---------- utilidades ----------
const toMin = s => { const [h, m] = s.split(':').map(Number); return h*60 + m; };
const fmt = m => `${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(Math.floor(m%60)).padStart(2,'0')}`;
const money = n => '$' + Math.round(n).toLocaleString('en-US');
function isOpen(s, t = G.minutes) { const h = s.hours; if (h.always_open) return true; const o = toMin(h.open), c = toMin(h.close); t %= 1440; return o < c ? (t >= o && t < c) : (t >= o || t < c); }
const locked = s => s.unlock && s.unlock.locked_by_default && G.story < 1;
function inPoly(x, y, P) { let c = false; for (let i = 0, j = P.length - 1; i < P.length; j = i++) { const [xi, yi] = P[i], [xj, yj] = P[j]; if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) c = !c; } return c; }
function segDist(px, py, [ax, ay], [bx, by]) { const dx = bx-ax, dy = by-ay, t = Math.max(0, Math.min(1, ((px-ax)*dx + (py-ay)*dy) / (dx*dx + dy*dy))); return Math.hypot(px - (ax + t*dx), py - (ay + t*dy)); }
function isLand(mx, my) {
  if (mx < 2 || my < 2 || mx > 998 || my > 998) return false;
  if (inPoly(mx, my, LAND)) return true;
  if (ISLANDS.some(([x, y, r]) => Math.hypot(mx - x, my - y) < r + 4)) return true;
  return BRIDGES.some(([a, b]) => segDist(mx, my, a, b) < 7);
}
function zoneAt(mx, my) {
  for (const id of ['downtown-blaze','sunset-strip','port-sable','coral-keys','swamp-row']) { const b = G.zones[id]?.bounds; if (b && mx >= b.x[0] && mx <= b.x[1] && my >= b.y[0] && my <= b.y[1]) return G.zones[id]; }
  return null;
}
function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; }
let rngSeed = 7; const rnd = () => (rngSeed = (rngSeed * 16807) % 2147483647) / 2147483647;
function toast(msg, ms = 2600) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, ms); }

const PRICE = { armeria:[300,2500], ropa:[40,900], autos:[18000,240000], tatuajes:[60,400], comida:[6,30], tienda24:[3,40], bar:[10,300], inmobiliaria:[40000,900000], tecnologia:[150,2200], gimnasio:[40,300], banco:[0,0], empeno:[20,1500], servicios:[0,500], club_adulto:[20,800] };
const priceOf = (s, item) => { const [a, b] = PRICE[s.category] || [10, 100], step = a > 1000 ? 100 : 1; return Math.round((a + (b - a) * hash(s.id + item)) / step) * step; };

// ---------- carga ----------
const fontsReady = document.fonts ? document.fonts.load('40px Bungee').catch(() => {}) : Promise.resolve();
Promise.all([fetch('stores.json').then(r => { if (!r.ok) throw 0; return r.json(); }), fontsReady])
  .then(([d]) => { if (!window.THREE) throw 0; init(d); $('loading').hidden = true; })
  .catch(() => { $('loading').hidden = true; const e = $('err'); e.hidden = false; e.textContent = 'No se pudo cargar la ciudad. Recargá la página.'; });

// ---------- textura del mapa (suelo 3D, minimapa y mapa grande) ----------
const TEX = 2048, PX = TEX / 1000;
function drawGround(ctx) {
  ctx.fillStyle = '#16507a'; ctx.fillRect(0, 0, TEX, TEX);
  ctx.save();
  ctx.beginPath(); LAND.forEach(([x, y], i) => i ? ctx.lineTo(x*PX, y*PX) : ctx.moveTo(x*PX, y*PX)); ctx.closePath();
  ctx.fillStyle = '#e8d3a0'; ctx.fill();
  ctx.clip();
  ctx.fillStyle = ZONE._.ground; ctx.fillRect(8, 8, TEX - 16, TEX - 16);
  for (const z of G.data.zones) { if (z.id === 'coral-keys') continue; const b = z.bounds; ctx.fillStyle = ZONE[z.id].ground; ctx.fillRect(b.x[0]*PX, b.y[0]*PX, (b.x[1]-b.x[0])*PX, (b.y[1]-b.y[0])*PX); }
  ctx.fillStyle = '#1f4a3c'; PUDDLES.forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x*PX, y*PX, r*PX, 0, 7); ctx.fill(); });
  ctx.fillStyle = '#26232f';
  for (let k = 50; k < 1000; k += 100) { ctx.fillRect(k*PX - 7.5*PX, 0, 15*PX, TEX); ctx.fillRect(0, k*PX - 7.5*PX, TEX, 15*PX); }
  ctx.strokeStyle = 'rgba(255,210,63,0.55)'; ctx.lineWidth = 1.2; ctx.setLineDash([8, 8]);
  for (let k = 50; k < 1000; k += 100) { ctx.beginPath(); ctx.moveTo(k*PX, 0); ctx.lineTo(k*PX, TEX); ctx.moveTo(0, k*PX); ctx.lineTo(TEX, k*PX); ctx.stroke(); }
  ctx.setLineDash([]);
  ctx.restore();
  ISLANDS.forEach(([x, y, r]) => { ctx.fillStyle = '#e8d3a0'; ctx.beginPath(); ctx.arc(x*PX, y*PX, (r+5)*PX, 0, 7); ctx.fill(); ctx.fillStyle = ZONE['coral-keys'].ground; ctx.beginPath(); ctx.arc(x*PX, y*PX, r*PX, 0, 7); ctx.fill(); });
  ctx.strokeStyle = '#26232f'; ctx.lineWidth = 13*PX; ctx.lineCap = 'round';
  BRIDGES.forEach(([a, b]) => { ctx.beginPath(); ctx.moveTo(a[0]*PX, a[1]*PX); ctx.lineTo(b[0]*PX, b[1]*PX); ctx.stroke(); });
}

// ---------- inicio ----------
let groundCanvas, renderer, scene, camera, sun, hemi, player, car, beam, colliders = [];
function init(data) {
  G.data = data;
  data.zones.forEach(z => G.zones[z.id] = z);
  data.categories.forEach(c => G.cats[c.id] = c);
  placeStores();
  groundCanvas = document.createElement('canvas'); groundCanvas.width = groundCanvas.height = TEX;
  drawGround(groundCanvas.getContext('2d'));
  build3D();
  buildMapUI();
  const m = MISSIONS[Math.min(G.mission, 2)];
  if (m.store) setWaypoint(G.stores.find(s => s.id === m.store));
  updateMissionHUD();
  requestAnimationFrame(loop);
  toast('Bienvenido a Heat City. Abrí el mapa con M para buscar tiendas.', 4000);
}

// Las tiendas se ubican en la manzana más cercana para no quedar en medio de la calle.
function placeStores() {
  const taken = [];
  for (const s of G.data.stores) {
    let { x, y } = s.position;
    if (s.zone !== 'coral-keys') {
      const bx = Math.round(x / 100) * 100, by = Math.round(y / 100) * 100;
      const opts = [[-21,-21],[21,-21],[-21,21],[21,21]].map(([dx, dy]) => [bx + dx, by + dy]).sort((a, b) => Math.hypot(a[0]-x, a[1]-y) - Math.hypot(b[0]-x, b[1]-y));
      const free = opts.find(([px, py]) => !taken.some(([tx, ty]) => Math.hypot(tx-px, ty-py) < 20) && inPoly(px, py, LAND) && inPoly(px, py + 16, LAND)) || opts[0];
      [x, y] = free;
    }
    taken.push([x, y]);
    G.stores.push(Object.assign({}, s, { mx: x, my: y }));
  }
}

function makeLabel(text, sub, color, gold) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 160;
  const x = c.getContext('2d');
  x.fillStyle = gold ? '#ffd23f' : 'rgba(15,11,30,0.92)'; x.beginPath(); if (x.roundRect) x.roundRect(8, 8, 496, 144, 28); else x.rect(8, 8, 496, 144); x.fill();
  x.lineWidth = 8; x.strokeStyle = color; x.stroke();
  x.fillStyle = gold ? '#0f0b1e' : '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';

function build3D() {

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.MeshLambertMaterial({ map: gtex }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);

  for (let bx = 100; bx < 1000; bx += 100) for (let by = 100; by < 1000; by += 100) {
    for (const [dx, dy] of [[-21,-21],[21,-21],[-21,21],[21,21]]) {
      const mx = bx + dx, my = by + dy;
      if (!inPoly(mx, my, LAND) || !inPoly(mx - 16, my - 16, LAND) || !inPoly(mx + 16, my + 16, LAND) || !inPoly(mx + 16, my - 16, LAND) || !inPoly(mx - 16, my + 16, LAND)) continue;
      if (G.stores.some(s => Math.hypot(s.mx - mx, s.my - my) < 20)) continue;
      if (PUDDLES.some(([x, y, r]) => Math.hypot(mx - x, my - y) < r + 10)) continue;
      const z = zoneAt(mx, my), st = ZONE[z ? z.id : '_'];
      if (z && z.id === 'swamp-row' && rnd() < 0.45) continue;
      const wide = z && z.id === 'port-sable';
      const w = (wide ? 30 : 22 + rnd() * 6) * S, d = (wide ? 26 : 22 + rnd() * 6) * S;
      const h = st.h[0] + rnd() * (st.h[1] - st.h[0]);

  }
  ISLANDS.forEach(([x, y, r]) => { for (let i = 0; i < 3; i++) { const a = rnd() * 6.28, rr = r * 0.6; const mx = x + Math.cos(a) * rr, my = y + Math.sin(a) * rr; if (G.stores.some(s => Math.hypot(s.mx - mx, s.my - my) < 24)) continue; boxes.push({ mx, my, w: 9, d: 9, h: 5 + rnd() * 6, color: ZONE['coral-keys'].bld[i % 3] }); } });

  const geo = new THREE.BoxGeometry(1, 1, 1); geo.translate(0, 0.5, 0);
  const inst = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial(), boxes.length);
  const m4 = new THREE.Matrix4(), col = new THREE.Color();
  boxes.forEach((b, i) => {
    const p = W2M(b.mx, b.my);
    m4.makeScale(b.w, b.h, b.d); m4.setPosition(p.x, 0, p.z); inst.setMatrixAt(i, m4);

  // ventanas que se encienden de noche

  const tall = boxes.filter(b => b.h > 15);
  const wins = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), winMat, Math.max(1, tall.length * 2));
  const rotY = new THREE.Matrix4().makeRotationY(Math.PI);
  tall.forEach((b, i) => {
    const p = W2M(b.mx, b.my), sc = new THREE.Matrix4().makeScale(b.w * 0.8, b.h * 0.8, 1);
    wins.setMatrixAt(i * 2, new THREE.Matrix4().makeTranslation(p.x, b.h * 0.5, p.z + b.d / 2 + 0.05).multiply(sc));
    wins.setMatrixAt(i * 2 + 1, new THREE.Matrix4().makeTranslation(p.x, b.h * 0.5, p.z - b.d / 2 - 0.05).multiply(rotY).multiply(sc));

  wins.count = tall.length * 2;
  scene.add(wins); G.winMat = winMat;

  // palmeras en Sunset Strip y Coral Keys
  const trunkG = new THREE.CylinderGeometry(0.25, 0.35, 7, 6); trunkG.translate(0, 3.5, 0);
  const leafG = new THREE.ConeGeometry(2.6, 1.6, 7); leafG.translate(0, 7.4, 0);
  const palms = [];
  for (let k = 50; k < 1000; k += 100) for (let j = 0; j < 1000; j += 25) {
    for (const [mx, my] of [[k - 10, j], [j, k - 10]]) { const z = zoneAt(mx, my); if (z && (z.id === 'sunset-strip' || z.id === 'coral-keys') && isLand(mx, my) && !G.stores.some(s => Math.hypot(s.mx - mx, s.my - my) < 16)) palms.push(W2M(mx, my)); }
  }
  const trunks = new THREE.InstancedMesh(trunkG, new THREE.MeshLambertMaterial({ color: 0x8a6a48 }), Math.max(1, palms.length));
  const leaves = new THREE.InstancedMesh(leafG, new THREE.MeshLambertMaterial({ color: 0x2f9a5a }), Math.max(1, palms.length));
  palms.forEach((p, i) => { m4.makeTranslation(p.x, 0, p.z); trunks.setMatrixAt(i, m4); leaves.setMatrixAt(i, m4); });
  trunks.count = leaves.count = palms.length;
  scene.add(trunks, leaves);

  // locales
  for (const s of G.stores) {
    const c = G.cats[s.category], p = W2M(s.mx, s.my);

    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: new THREE.Color(c.color).lerp(new THREE.Color(0x222222), 0.35) }));
    body.position.set(p.x, h / 2, p.z); scene.add(body);
    const awning = new THREE.Mesh(new THREE.BoxGeometry(w + 1, 0.4, 3), new THREE.MeshLambertMaterial({ color: heist ? 0xffd23f : c.color }));
    awning.position.set(p.x, 4, p.z + d / 2 + 1.5); scene.add(awning);
    const door = new THREE.Mesh(new THREE.PlaneGeometry(3, 3.6), new THREE.MeshBasicMaterial({ color: locked(s) ? 0x333333 : 0xfff0c0 }));
    door.position.set(p.x, 1.8, p.z + d / 2 + 0.02); scene.add(door); s.door = door;
    const label = makeLabel(s.name.toUpperCase(), c.name, heist ? '#ffd23f' : c.color, heist);
    label.position.set(p.x, h + 3, p.z + d / 2 - 1); scene.add(label);
    colliders.push({ x: p.x, z: p.z, hw: w / 2, hd: d / 2 });
    s.wx = p.x; s.wz = p.z + d / 2 + 2.5;   // punto de entrada, frente a la puerta
  }

  beam = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 140, 16, 1, true), new THREE.MeshBasicMaterial({ color: 0xff3d8b, transparent: true, opacity: 0.28, depthWrite: false, side: THREE.DoubleSide }));
  beam.visible = false; scene.add(beam);

  car = makeCar(0xff3d8b);
  const cp = W2M(455, 470); car.position.set(cp.x, 0, cp.z); car.userData.speed = 0; scene.add(car);

  addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
}

// ---------- colisiones ----------
function blocked(x, z, r) {
  const { mx, my } = M2W(x, z);
  if (!isLand(mx, my)) return true;
  for (const c of colliders) if (Math.abs(x - c.x) < c.hw + r && Math.abs(z - c.z) < c.hd + r) return true;
  return false;
}
function moveWithCollision(obj, dx, dz, r) {
  let hit = false;
  if (!blocked(obj.position.x + dx, obj.position.z, r)) obj.position.x += dx; else hit = true;
  if (!blocked(obj.position.x, obj.position.z + dz, r)) obj.position.z += dz; else hit = true;
  return hit;
}

const pointers = new Map(); let joy = null;
$('view').addEventListener('pointerdown', e => {
  $('view').setPointerCapture(e.pointerId);

  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (joy && joy.id === e.pointerId) { joy.dx = e.clientX - joy.ox; joy.dy = e.clientY - joy.oy; return; }
  const p = pointers.get(e.pointerId); if (!p) return;
  G.camYaw -= (e.clientX - p.x) * 0.006; G.camPitch = Math.max(0.05, Math.min(1.1, G.camPitch + (e.clientY - p.y) * 0.004));

const MV = { zoom: 1, cx: 500, cy: 500, sel: null, q: '' };

const visibleStores = () => G.stores.filter(s => !G.hidden.has(s.category) && !locked(s));

function mapScale() { const cv = $('bigmap'); return Math.min(cv.clientWidth, cv.clientHeight) / 1000 * MV.zoom; }
function screenToMap(sx, sy) { const cv = $('bigmap'), k = mapScale(); return { x: MV.cx + (sx - cv.clientWidth / 2) / k, y: MV.cy + (sy - cv.clientHeight / 2) / k }; }
function openMap(sel) {
  G.mode = 'map'; G.keys = {}; $('mapScreen').hidden = false; $('prompt').hidden = true;
  if (sel) { MV.cx = sel.mx; MV.cy = sel.my; MV.zoom = 3; } else { MV.cx = 500; MV.cy = 500; MV.zoom = 1; }
  MV.sel = sel || G.waypoint || null;
  renderList(); renderDetail();
}
function closeMap() { G.mode = 'play'; $('mapScreen').hidden = true; $('search').blur(); }
function selectStore(s) { MV.sel = s; renderList(); renderDetail(); }
function renderList() {
  if (G.mode !== 'map') return;
  const fp = M2W(focusPos().x, focusPos().z);
  const items = visibleStores().filter(s => !MV.q || [s.name, G.zones[s.zone].name, G.cats[s.category].name, ...s.sells].join(' ').toLowerCase().includes(MV.q))
    .map(s => ({ s, d: Math.hypot(s.mx - fp.mx, s.my - fp.my) * S })).sort((a, b) => a.d - b.d);
  $('list').innerHTML = items.length ? items.map(({ s, d }) => `<button class="it ${MV.sel === s ? 'sel' : ''}" data-id="${s.id}" type="button"><span class="d" style="background:${s.special?.pin_color || G.cats[s.category].color}"></span><span>${s.name}<small>${G.cats[s.category].name} · ${G.zones[s.zone].name}</small></span><span class="dist">${Math.round(d)} m</span></button>`).join('') : '<p style="color:var(--muted);padding:8px;font-size:13px">No hay tiendas que coincidan.</p>';
  $('list').querySelectorAll('.it').forEach(b => b.onclick = () => { const s = G.stores.find(x => x.id === b.dataset.id); selectStore(s); MV.cx = s.mx; MV.cy = s.my; MV.zoom = Math.max(MV.zoom, 2.5); });
}
function renderDetail() {
  const el = $('detail'), s = MV.sel;
  if (!s || G.mode !== 'map') { el.hidden = true; return; }
  const c = G.cats[s.category], open = isOpen(s);
  el.hidden = false;
  el.innerHTML = `<div class="meta"><span class="pill" style="color:${c.color};border-color:${c.color}">${c.name}</span><span class="pill">${G.zones[s.zone].name}</span><span class="pill ${open ? 'open' : 'closed'}">${open ? 'Abierto' : 'Cerrado'} · ${s.hours.always_open ? '24 h' : s.hours.open + '–' + s.hours.close}</span>${s.special ? `<span class="pill heist">${s.special.label}</span>` : ''}</div>
    <h3>${s.name}</h3><p>${s.description}</p><p>Vende: ${s.sells.join(', ')}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${G.waypoint === s ? '<button class="btn" id="wpOff" type="button">Quitar ruta</button>' : '<button class="btn primary" id="wpOn" type="button">Marcar ruta e ir</button>'}</div>`;
  const on = $('wpOn'), off = $('wpOff');
  if (on) on.onclick = () => { setWaypoint(s); toast(`Ruta marcada a ${s.name}. Seguí la luz rosa.`); closeMap(); };
  if (off) off.onclick = () => setWaypoint(null);
}

function drawMapLayer(ctx, cx, cy, k, w, h, opts) {
  ctx.save();
  ctx.fillStyle = '#16507a'; ctx.fillRect(0, 0, w, h);
  ctx.translate(w / 2 - cx * k, h / 2 - cy * k);
  ctx.drawImage(groundCanvas, 0, 0, 1000 * k, 1000 * k);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (opts.labels) {
    for (const z of G.data.zones) { const b = z.bounds; ctx.font = `${Math.round(Math.max(12, Math.min(28, 22 * k / opts.base)))}px Bungee, Impact, sans-serif`; ctx.fillStyle = ZONE[z.id].accent; ctx.globalAlpha = 0.85; ctx.fillText(z.name.toUpperCase(), (b.x[0] + b.x[1]) / 2 * k, (b.y[0] + b.y[1]) / 2 * k); }
    ctx.globalAlpha = 1;
  }
  const r = opts.pin;
  for (const s of visibleStores()) {
    const x = s.mx * k, y = s.my * k, c = G.cats[s.category], heist = s.special?.type === 'golpe';
    if (heist) { ctx.fillStyle = 'rgba(255,210,63,0.3)'; ctx.beginPath(); ctx.arc(x, y, r * (1.7 + 0.25 * Math.sin(performance.now() / 280)), 0, 7); ctx.fill(); }
    ctx.globalAlpha = isOpen(s) ? 1 : 0.55;
    ctx.fillStyle = heist ? '#ffd23f' : c.color; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    const sel = s === MV.sel && opts.labels;
    ctx.lineWidth = sel ? 3 : 1.5; ctx.strokeStyle = sel ? '#fff' : '#0f0b1e'; ctx.stroke();
    if (r >= 7) { ctx.fillStyle = heist ? '#0f0b1e' : '#fff'; ctx.font = `700 ${Math.round(r * (GLYPH[s.category].length > 1 ? 0.8 : 1.1))}px Inter, sans-serif`; ctx.fillText(heist ? '$' : GLYPH[s.category], x, y + 0.5); }
    ctx.globalAlpha = 1;
    if (opts.labels && k > 1.6) { ctx.font = '600 11px Inter, sans-serif'; const tw = ctx.measureText(s.name).width + 10; ctx.fillStyle = 'rgba(15,11,30,0.85)'; ctx.fillRect(x - tw / 2, y + r + 3, tw, 16); ctx.fillStyle = '#f4ecff'; ctx.fillText(s.name, x, y + r + 11); }
  }
  const fp = M2W(focusPos().x, focusPos().z);
  if (G.waypoint) { ctx.strokeStyle = '#ff3d8b'; ctx.lineWidth = 3; ctx.setLineDash([6, 5]); ctx.beginPath(); ctx.moveTo(fp.mx * k, fp.my * k); ctx.lineTo(G.waypoint.mx * k, G.waypoint.my * k); ctx.stroke(); ctx.setLineDash([]); }
  const heading = G.inCar ? car.rotation.y : player.rotation.y;
  ctx.translate(fp.mx * k, fp.my * k); ctx.rotate(Math.PI - heading);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#ff3d8b'; ctx.lineWidth = 2.5;
  const a = 10;
  ctx.beginPath(); ctx.moveTo(0, -a); ctx.lineTo(a * 0.7, a * 0.8); ctx.lineTo(0, a * 0.4); ctx.lineTo(-a * 0.7, a * 0.8); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function drawBigMap() {
  const cv = $('bigmap'), dpr = Math.min(devicePixelRatio || 1, 2), w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawMapLayer(ctx, MV.cx, MV.cy, mapScale(), w, h, { labels: true, pin: Math.max(7, 6 * Math.sqrt(MV.zoom)), base: MV.zoom });
  $('mapClock').textContent = fmt(G.minutes);
}
function drawMinimap() {
  const cv = $('minimap'), ctx = cv.getContext('2d'), fp = M2W(focusPos().x, focusPos().z);
  ctx.save(); ctx.beginPath(); ctx.arc(160, 160, 160, 0, 7); ctx.clip();
  drawMapLayer(ctx, fp.mx, fp.my, 1.6, 320, 320, { labels: false, pin: 9 });
  ctx.restore();
  if (G.waypoint) {
    const dx = G.waypoint.mx - fp.mx, dy = G.waypoint.my - fp.my;
    if (Math.hypot(dx, dy) * 1.6 > 150) { const a = Math.atan2(dy, dx); ctx.fillStyle = '#ff3d8b'; ctx.beginPath(); ctx.arc(160 + Math.cos(a) * 140, 160 + Math.sin(a) * 140, 10, 0, 7); ctx.fill(); }
  }
}

// ---------- loop ----------
let last = performance.now(), hudTick = 0;
const v3 = new THREE.Vector3(), skyDay = new THREE.Color(0x9ec9e8), skyDusk = new THREE.Color(0xff8a5c), skyNight = new THREE.Color(0x120c2a);
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  G.minutes = (G.minutes + dt) % 1440;                     // 1 s real = 1 min de juego
  if (G.heistCooldown > 0) G.heistCooldown -= dt;
  if (G.mode === 'play') update(dt);
  updateLighting();
  updateCamera(dt);
  renderer.render(scene, camera);
  if (G.mode === 'map') drawBigMap();
  if ((hudTick += dt) > 0.05) { hudTick = 0; drawMinimap(); updateHUD(); }
  requestAnimationFrame(loop);
}

function inputVec() {
  const k = G.keys;
  let ix = (k['d'] || k['arrowright'] ? 1 : 0) - (k['a'] || k['arrowleft'] ? 1 : 0);
  let iy = (k['w'] || k['arrowup'] ? 1 : 0) - (k['s'] || k['arrowdown'] ? 1 : 0);
  let run = !!k['shift'];
  if (joy) { const m = Math.hypot(joy.dx, joy.dy); if (m > 10) { ix = joy.dx / Math.max(m, 60); iy = -joy.dy / Math.max(m, 60); run = m > 55; } }
  return { ix, iy, run };
}

function update(dt) {
  const { ix, iy, run } = inputVec();
  if (G.inCar) {
    const c = car.userData, max = run ? 46 : 32;
    if (iy > 0) c.speed += 18 * dt * iy; else if (iy < 0) c.speed += (c.speed > 0 ? 34 : 12) * dt * iy; else c.speed *= (1 - 1.2 * dt);
    c.speed = Math.max(-10, Math.min(max, c.speed));
    if (Math.abs(c.speed) > 0.3) car.rotation.y -= ix * dt * 1.9 * Math.min(1, Math.abs(c.speed) / 8) * Math.sign(c.speed);
    if (moveWithCollision(car, Math.sin(car.rotation.y) * c.speed * dt, Math.cos(car.rotation.y) * c.speed * dt, 1.6)) c.speed *= -0.25;
    player.position.copy(car.position);
  } else {
    const ud = player.userData, m = Math.hypot(ix, iy);
    if (m > 0.05) {
      const n = Math.min(m, 1) / m, sp = (run ? 9.5 : 4.6) * Math.min(m, 1);
      const fwdX = -Math.sin(G.camYaw), fwdZ = -Math.cos(G.camYaw), rX = -fwdZ, rZ = fwdX;
      const dx = (fwdX * iy + rX * ix) * n * sp * dt, dz = (fwdZ * iy + rZ * ix) * n * sp * dt;
      moveWithCollision(player, dx, dz, 0.45);
      let diff = Math.atan2(dx, dz) - player.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      player.rotation.y += diff * Math.min(1, dt * 12);
      ud.phase += dt * (run ? 13 : 8);
      const sw = Math.sin(ud.phase) * (run ? 0.9 : 0.6);
      ud.legL.rotation.x = sw; ud.legR.rotation.x = -sw; ud.armL.rotation.x = -sw * 0.8; ud.armR.rotation.x = sw * 0.8;
      player.position.y = Math.abs(Math.sin(ud.phase)) * (run ? 0.08 : 0.04);
    } else {
      ['legL','legR','armL','armR'].forEach(l => ud[l].rotation.x *= 0.8); player.position.y = 0;
    }
  }
  nearStore = null; let bd = 5.5;
  if (!G.inCar) for (const s of G.stores) { const d = Math.hypot(s.wx - player.position.x, s.wz - player.position.z); if (d < bd) { bd = d; nearStore = s; } }
  const w = G.waypoint;
  if (w && !w._arrived && Math.hypot(w.wx - focusPos().x, w.wz - focusPos().z) < 10) { w._arrived = true; toast(`Llegaste a ${w.name}. ${G.inCar ? 'Bajate (F) y entrá' : 'Entrá'} con E.`); }
}

function updateCamera(dt) {
  const t = focusPos();
  if (G.inCar && !pointers.size) { let diff = (car.rotation.y + Math.PI) - G.camYaw; diff = Math.atan2(Math.sin(diff), Math.cos(diff)); G.camYaw += diff * Math.min(1, dt * 3); }
  const dist = G.inCar ? 11 : 6.2, hgt = G.inCar ? 2.2 : 1.7;
  v3.set(t.x + Math.sin(G.camYaw) * Math.cos(G.camPitch) * dist, hgt + Math.sin(G.camPitch) * dist, t.z + Math.cos(G.camYaw) * Math.cos(G.camPitch) * dist);
  camera.position.lerp(v3, Math.min(1, dt * 10));
  camera.lookAt(t.x, hgt, t.z);
  beam.material.opacity = 0.18 + 0.1 * Math.sin(performance.now() / 300);
}

function updateLighting() {
  const t = G.minutes / 60;
  const day = t >= 7 && t < 18 ? 1 : t >= 18 && t < 21 ? 1 - (t - 18) / 3 : t >= 5 && t < 7 ? (t - 5) / 2 : 0;
  const dusk = (t >= 17 && t < 21) || (t >= 5 && t < 7) ? 1 - Math.abs(day - 0.5) * 2 : 0;
  const sky = skyNight.clone().lerp(skyDay, day).lerp(skyDusk, dusk * 0.5);
  renderer.setClearColor(sky); scene.fog.color.copy(sky);
  sun.intensity = 0.15 + 0.85 * day; hemi.intensity = 0.35 + 0.55 * day;
  sun.color.set(dusk > 0.3 ? 0xffb07a : 0xfff0d8);
  G.winMat.opacity = (1 - day) * 0.75;
}

function updateHUD() {
  $('clock').textContent = fmt(G.minutes);
  $('money').textContent = money(G.money);
  const fp = M2W(focusPos().x, focusPos().z), z = zoneAt(fp.mx, fp.my);
  $('zone').textContent = z ? z.name.toUpperCase() : 'AFUERAS';
  const pr = $('prompt');
  if (G.mode !== 'play') pr.hidden = true;
  else if (nearStore) { pr.innerHTML = locked(nearStore) ? `${nearStore.name} · Cerrado por ahora` : `<kbd>E</kbd>Entrar a ${nearStore.name}`; pr.hidden = false; }
  else if (!G.inCar && player.position.distanceTo(car.position) < 6) { pr.innerHTML = '<kbd>F</kbd>Subir al auto'; pr.hidden = false; }
  else pr.hidden = true;
  if (G.waypoint) {
    const w = G.waypoint, dx = w.wx - focusPos().x, dz = w.wz - focusPos().z, d = Math.hypot(dx, dz);
    const camFwd = Math.atan2(-Math.sin(G.camYaw), -Math.cos(G.camYaw)), ang = Math.atan2(dx, dz);
    $('gpsArrow').style.transform = `rotate(${Math.atan2(Math.sin(camFwd - ang), Math.cos(camFwd - ang))}rad)`;
    $('gpsText').textContent = `${w.name} · ${Math.round(d)} m`;
  }
}
})();
</script>
